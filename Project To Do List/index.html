<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
    <h2>Advanced To-Do List 🚀</h2>
    
    <div class="input-section">
        <input type="text" id="todo-input" placeholder="Mau ngapain hari ini?">
        <button id="add-btn">Tambah</button>
    </div>


    <div class="filter-section">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="active">Belum Selesai</button>
        <button class="filter-btn" data-filter="completed">Selesai</button>
    </div>

    <ul id="todo-list"></ul>
</div>

    <script src="script.js"></script>
</body>
</html>
